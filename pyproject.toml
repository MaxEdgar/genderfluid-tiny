[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "genderfluid-tiny"
version = "1.0.0"
description = "Ultra-tiny name-gender association classifier"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.0",
    "numpy>=1.20",
    "pyyaml>=5.4",
]

[project.scripts]
genderfluid = "predict:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
