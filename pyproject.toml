[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genderfluid-tiny"
version = "1.0.0"
description = "Tiny local name-gender association classifier"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.0",
    "numpy>=1.20",
    "pyyaml>=5.4",
]

[project.scripts]
genderfluid = "genderfluid.cli:main"

[tool.setuptools.packages.find]
include = ["genderfluid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
