[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genderfluid-tiny"
version = "1.0.2"
description = "Tiny offline Python name-gender classifier. Predicts gender associations from names. 49KB model, CPU only, no API."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [
    {name = "Max Edgar"},
]
keywords = [
    "name", "gender", "classifier", "nlp", "offline",
    "name-gender", "gender-detection", "baby-names",
    "lightweight", "privacy", "scikit-learn", "local",
    "no-api", "tiny", "name-classification", "gender-prediction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.0",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/MaxEdgar/genderfluid-tiny"
Repository = "https://github.com/MaxEdgar/genderfluid-tiny"
Issues = "https://github.com/MaxEdgar/genderfluid-tiny/issues"
Documentation = "https://maxedgar.github.io/genderfluid-tiny/"
Changelog = "https://github.com/MaxEdgar/genderfluid-tiny/releases"

[project.scripts]
genderfluid = "genderfluid.cli:main"

[tool.setuptools.packages.find]
include = ["genderfluid*"]

[tool.setuptools.package-data]
genderfluid = ["models/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
